  <body class="bg-grad">

      <!-- will load common navbar with js $().load() method -->
    </div>

    <!-- START CONTACT SECTION -->
    <section id="contact" class="contact-section">
      <div class="container text-center">
        <div class="contact-section-header">
          <h2 class="robo_bold_26">Contacts</h2>
        </div>
        <div class="">
          <a
            href="https://facebook.com/arpadherbut"
            target="_blank"
            class="btn contact-details"
            ><i class="fab fa-facebook-square"></i
          ></a>
          <a
            href="https://linkedin.com/in/arpadherbut"
            target="_blank"
            class="btn contact-details"
            ><i class="fab fa-linkedin-in"></i>
          </a>
          <a href="mailto:herbut.arp@gmail.com" class="btn contact-details"
            ><i class="fas fa-at"></i
          ></a>
          <br />
          <a href="tel:817-489-8846" class="btn contact-details"
            ><i class="fas fa-mobile-alt"> (817) 489-8846</i>
          </a>
        </div>
        <div class="">
          <p class="robo_bold_22">Download my resume:</p>
          <a
            href="https://s3.us-east-2.amazonaws.com/arpadherbut.com/Resume-Arpad_Herbut.docx"
            download
            class="btn contact-details"
          >
            <i class="fas fa-file-word"></i>
          </a>
          <a
            href="https://s3.us-east-2.amazonaws.com/arpadherbut.com/Resume-Arpad_Herbut.pdf"
            download
            class="btn contact-details"
            target="_blank"
          >

          </a>
